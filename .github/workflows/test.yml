name: "Test"
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'releases/*'

jobs:
  lint-and-unit:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test

  integration:
    name: Action Integration Test
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile && pnpm run prepare
      - uses: ./
        id: juejin
        with:
          user_id: '4142615541064046'
          limit: '5'
      - name: Check output
        run: |
          echo "Output md length: ${#JUEJIN_POST_MD}"
          echo "$JUEJIN_POST_MD" | head -5
          test -n "$JUEJIN_POST_MD" || exit 1
      - name: Check step output
        run: test -n "${{ steps.juejin.outputs.md }}" || exit 1
